<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="refresh" content="0; url=mobile.html?v=bc0f7e0">
  <meta name="apple-mobile-web-app-title" content="美食收藏">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#df6d23">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <title>美食收藏</title>
  <script>location.replace("mobile.html?v=bc0f7e0");</script>
  <style>
    :root {
      --bg: #f4f5f3;
      --panel: #ffffff;
      --panel-strong: #fff8ef;
      --text: #25211c;
      --muted: #756b5f;
      --line: #e6ded2;
      --accent: #d94f30;
      --accent-strong: #b83c22;
      --green: #28745b;
      --gold: #b47b16;
      --shadow: 0 18px 45px rgba(58, 42, 24, .12);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .82), rgba(244, 245, 243, .94)),
        var(--bg);
      letter-spacing: 0;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #e7a02f);
      box-shadow: 0 10px 26px rgba(217, 79, 48, .22);
      font-weight: 800;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .primary-btn,
    .ghost-btn,
    .danger-btn,
    .mini-btn {
      min-height: 40px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      white-space: nowrap;
    }

    .primary-btn {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 12px 28px rgba(217, 79, 48, .22);
    }

    .primary-btn:hover,
    .ghost-btn:hover,
    .danger-btn:hover,
    .mini-btn:hover {
      transform: translateY(-1px);
    }

    .primary-btn:hover { background: var(--accent-strong); }

    .ghost-btn,
    .mini-btn {
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
    }

    .danger-btn {
      color: #fff;
      background: #9f2b25;
    }

    .mini-btn {
      min-height: 34px;
      padding: 0 10px;
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 430px) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .toolbar {
      background: rgba(255, 253, 250, .88);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 14px;
      display: grid;
      gap: 10px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 10px;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      outline: none;
    }

    .textarea {
      resize: vertical;
      min-height: 96px;
      line-height: 1.55;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: rgba(217, 79, 48, .55);
      box-shadow: 0 0 0 3px rgba(217, 79, 48, .10);
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .list-panel,
    .detail-panel {
      background: rgba(255, 253, 250, .92);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .food-list {
      display: grid;
      gap: 0;
    }

    .food-row {
      width: 100%;
      background: transparent;
      color: inherit;
      text-align: left;
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .food-row:last-child { border-bottom: 0; }

    .food-row:hover,
    .food-row.active {
      background: var(--panel-strong);
    }

    .index {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #f0e4d6;
      color: #7b4b1f;
      font-weight: 800;
      font-size: 14px;
    }

    .row-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .row-name {
      font-size: 17px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rating {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .row-summary {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .chip {
      border: 1px solid #eadfcd;
      color: #6b5540;
      background: #fffaf1;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      line-height: 1;
    }

    .detail-panel {
      min-height: 560px;
    }

    .detail-empty {
      min-height: 560px;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--muted);
      text-align: center;
    }

    .detail {
      display: grid;
      gap: 20px;
      padding: 22px;
    }

    .detail-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    .detail h2 {
      margin: 0;
      font-size: clamp(24px, 3.4vw, 36px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .meta-line {
      margin-top: 10px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      font-size: 14px;
    }

    .section {
      display: grid;
      gap: 10px;
    }

    .section-title {
      color: #7b4b1f;
      font-size: 14px;
      font-weight: 800;
    }

    .dish-list {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .dish-list li {
      background: #fff8ee;
      border: 1px solid #eadfcd;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .address-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      background: #f5faf6;
      border: 1px solid #d7e7dd;
      border-radius: 8px;
      padding: 13px;
    }

    .address-text {
      color: #254a3a;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .map-card {
      min-height: 230px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #d7e7dd;
      background:
        linear-gradient(90deg, rgba(40,116,91,.13) 1px, transparent 1px),
        linear-gradient(0deg, rgba(40,116,91,.13) 1px, transparent 1px),
        linear-gradient(135deg, #f9fbf8, #eaf4ee);
      background-size: 32px 32px, 32px 32px, auto;
      position: relative;
    }

    .map-pin {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 22px;
      height: 22px;
      border-radius: 50% 50% 50% 0;
      background: var(--accent);
      transform: translate(-50%, -50%) rotate(-45deg);
      box-shadow: 0 8px 20px rgba(217,79,48,.28);
    }

    .map-pin::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: #fff;
    }

    .map-info {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(215,231,221,.95);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 12px 28px rgba(33, 79, 55, .12);
      display: grid;
      gap: 4px;
    }

    .map-info strong { font-size: 16px; }
    .map-info span { color: var(--muted); font-size: 13px; line-height: 1.45; }

    .note-box {
      color: var(--muted);
      line-height: 1.65;
      background: #fff;
      border: 1px dashed #decfbd;
      border-radius: 8px;
      padding: 12px;
      min-height: 48px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .empty-state {
      padding: 34px 18px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(34, 26, 18, .46);
    }

    .modal.open { display: flex; }

    .modal-card {
      width: min(760px, 100%);
      max-height: min(92vh, 860px);
      overflow: auto;
      background: var(--panel);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.7);
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(255,253,250,.96);
      border-bottom: 1px solid var(--line);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }

    form {
      padding: 20px;
      display: grid;
      gap: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 700;
      font-size: 13px;
      color: #5a4330;
    }

    .field-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: #23201c;
      color: #fff;
      padding: 11px 14px;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0,0,0,.25);
      transition: opacity .2s ease, transform .2s ease;
      z-index: 20;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .detail-panel { min-height: 0; }
      .detail-empty { min-height: 280px; }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 22px, 1180px);
        padding-top: 18px;
      }

      .topbar,
      .detail-head,
      .address-box,
      .search-row,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
      }

      .topbar .primary-btn {
        width: 100%;
      }

      .detail {
        padding: 16px;
      }

      .food-row {
        padding: 14px;
      }

      .actions,
      .form-actions {
        justify-content: stretch;
      }

      .actions button,
      .form-actions button,
      .address-box a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">食</div>
        <div>
          <h1>美食收藏</h1>
          <div class="subtitle">把朋友圈、短视频、路过想吃的店，先稳稳收起来。</div>
        </div>
      </div>
      <button class="primary-btn" type="button" id="addBtn" title="添加收藏">
        <span aria-hidden="true">+</span>
        <span>添加收藏</span>
      </button>
    </header>

    <section class="layout">
      <div>
        <div class="toolbar">
          <div class="search-row">
            <input class="input" id="searchInput" type="search" placeholder="搜索店名、地址、必吃菜">
            <select class="select" id="categoryFilter" aria-label="分类筛选">
              <option value="">全部分类</option>
            </select>
          </div>
          <div class="stats">
            <span id="recordCount">0 家收藏</span>
            <span>最新收藏在前</span>
          </div>
        </div>

        <section class="list-panel" aria-label="收藏列表">
          <div class="food-list" id="foodList"></div>
        </section>
      </div>

      <section class="detail-panel" id="detailPanel" aria-label="店铺详情"></section>
    </section>
  </main>

  <div class="modal" id="formModal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="formTitle">添加收藏</h3>
        <button class="close-btn" type="button" id="closeModalBtn" title="关闭">×</button>
      </div>
      <form id="foodForm">
        <input type="hidden" id="recordId">
        <div class="form-grid">
          <label>
            店名 *
            <input class="input" id="nameInput" required placeholder="例如：松江夜油边">
          </label>
          <label>
            地址 *
            <input class="input" id="addressInput" required placeholder="例如：松江区玉树路2245号">
          </label>
          <label>
            分类
            <select class="select" id="categoryInput">
              <option value="">未分类</option>
              <option>烧烤</option>
              <option>火锅</option>
              <option>面馆</option>
              <option>小吃</option>
              <option>日料</option>
              <option>西餐</option>
              <option>咖啡甜品</option>
              <option>其他</option>
            </select>
          </label>
          <label>
            来源
            <select class="select" id="sourceInput">
              <option value="">未记录</option>
              <option>朋友推荐</option>
              <option>网上刷到</option>
              <option>亲测</option>
              <option>其他</option>
            </select>
          </label>
          <label>
            人均
            <input class="input" id="avgPriceInput" inputmode="numeric" type="number" min="0" placeholder="例如：98">
          </label>
          <label>
            评分
            <input class="input" id="ratingInput" inputmode="decimal" type="number" min="0" max="5" step="0.1" placeholder="0-5">
          </label>
        </div>
        <label>
          必吃菜单 *
          <span class="field-hint">每行写一个菜名</span>
          <textarea class="textarea" id="mustEatInput" required placeholder="烤五花肉&#10;烤牛肉串&#10;烤鸡翅"></textarea>
        </label>
        <label>
          备注
          <textarea class="textarea" id="noteInput" placeholder="营业时间、排队情况、想去原因都可以写这里"></textarea>
        </label>
        <div class="form-actions">
          <button class="ghost-btn" type="button" id="cancelBtn">取消</button>
          <button class="primary-btn" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "mssc.food.records.v1";
    const SEED_KEY = "mssc.food.seeded.v1";

    const sampleRecords = [
      {
        id: createId(),
        name: "松江夜油边",
        category: "烧烤",
        avgPrice: 98,
        rating: 4.6,
        source: "朋友推荐",
        mustEat: ["烤五花肉", "烤牛肉串", "烤鸡翅"],
        address: "松江区玉树路2245号",
        note: "永丰夜宵榜口碑店，适合晚上想吃烧烤的时候翻出来。",
        createdAt: "2026-08-10T04:00:00.000Z",
        updatedAt: "2026-08-10T04:00:00.000Z"
      },
      {
        id: createId(),
        name: "阿婆葱油拌面",
        category: "面馆",
        avgPrice: 28,
        rating: 4.3,
        source: "网上刷到",
        mustEat: ["葱油拌面", "炸猪排", "辣肉浇头"],
        address: "上海市黄浦区云南南路附近",
        note: "刷到好几次，先收藏，路过人民广场附近可以试试。",
        createdAt: "2026-08-09T11:30:00.000Z",
        updatedAt: "2026-08-09T11:30:00.000Z"
      }
    ];

    let records = loadRecords();
    let selectedId = records[0]?.id || "";

    const listEl = document.getElementById("foodList");
    const detailEl = document.getElementById("detailPanel");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const recordCount = document.getElementById("recordCount");
    const formModal = document.getElementById("formModal");
    const foodForm = document.getElementById("foodForm");
    const toast = document.getElementById("toast");

    function createId() {
      if (window.crypto?.randomUUID) {
        return window.crypto.randomUUID();
      }
      return `mssc-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function loadRecords() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }
      if (!localStorage.getItem(SEED_KEY)) {
        localStorage.setItem(SEED_KEY, "1");
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sampleRecords));
        return sampleRecords;
      }
      return [];
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatPrice(value) {
      return value ? `人均 ¥${value}` : "人均未记";
    }

    function formatRating(value) {
      return value ? `${Number(value).toFixed(1)} 分` : "未评分";
    }

    function visibleRecords() {
      const keyword = searchInput.value.trim().toLowerCase();
      const category = categoryFilter.value;
      return [...records]
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .filter(record => {
          const text = [
            record.name,
            record.address,
            record.category,
            record.source,
            record.note,
            ...(record.mustEat || [])
          ].join(" ").toLowerCase();
          const matchesKeyword = !keyword || text.includes(keyword);
          const matchesCategory = !category || record.category === category;
          return matchesKeyword && matchesCategory;
        });
    }

    function syncCategoryOptions() {
      const current = categoryFilter.value;
      const categories = Array.from(new Set(records.map(item => item.category).filter(Boolean))).sort();
      categoryFilter.innerHTML = `<option value="">全部分类</option>` + categories.map(item => {
        return `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`;
      }).join("");
      if (categories.includes(current)) {
        categoryFilter.value = current;
      }
    }

    function renderList() {
      const items = visibleRecords();
      recordCount.textContent = `${items.length} 家收藏`;
      if (!records.find(item => item.id === selectedId)) {
        selectedId = items[0]?.id || records[0]?.id || "";
      }

      if (!items.length) {
        listEl.innerHTML = `<div class="empty-state">还没有匹配的收藏。<br>可以换个关键词，或者添加第一家想吃的店。</div>`;
        renderDetail();
        return;
      }

      listEl.innerHTML = items.map((record, index) => {
        const firstDish = record.mustEat?.[0] ? `必吃：${record.mustEat[0]}` : "必吃菜单待补充";
        const summary = [record.category || "未分类", formatPrice(record.avgPrice), firstDish].join(" · ");
        return `
          <button class="food-row ${record.id === selectedId ? "active" : ""}" type="button" data-id="${record.id}">
            <span class="index">${index + 1}</span>
            <span>
              <span class="row-title">
                <span class="row-name">${escapeHtml(record.name)}</span>
                <span class="rating">${escapeHtml(formatRating(record.rating))}</span>
              </span>
              <span class="row-summary">${escapeHtml(summary)}</span>
              <span class="chips">
                <span class="chip">${escapeHtml(record.source || "未记录来源")}</span>
                <span class="chip">${escapeHtml(record.address)}</span>
              </span>
            </span>
          </button>
        `;
      }).join("");

      listEl.querySelectorAll(".food-row").forEach(row => {
        row.addEventListener("click", () => {
          selectedId = row.dataset.id;
          render();
        });
      });
      renderDetail();
    }

    function renderDetail() {
      const record = records.find(item => item.id === selectedId);
      if (!record) {
        detailEl.innerHTML = `<div class="detail-empty">从左侧选择一家店，或者先添加一条美食收藏。</div>`;
        return;
      }

      const mapUrl = `https://ditu.amap.com/search?query=${encodeURIComponent(record.address)}`;
      const dishes = (record.mustEat || []).map(item => `<li>${escapeHtml(item)}</li>`).join("");
      detailEl.innerHTML = `
        <article class="detail">
          <div class="detail-head">
            <div>
              <h2>${escapeHtml(record.name)}</h2>
              <div class="meta-line">
                <span>${escapeHtml(formatRating(record.rating))}</span>
                <span>${escapeHtml(record.category || "未分类")}</span>
                <span>${escapeHtml(formatPrice(record.avgPrice))}</span>
                <span>来源：${escapeHtml(record.source || "未记录")}</span>
              </div>
            </div>
            <div class="actions">
              <button class="ghost-btn" type="button" id="editBtn">编辑</button>
              <button class="danger-btn" type="button" id="deleteBtn">删除</button>
            </div>
          </div>

          <section class="section">
            <div class="section-title">必吃菜单</div>
            <ul class="dish-list">${dishes}</ul>
          </section>

          <section class="section">
            <div class="section-title">地址</div>
            <div class="address-box">
              <div class="address-text">${escapeHtml(record.address)}</div>
              <a class="mini-btn" href="${mapUrl}" target="_blank" rel="noopener">打开地图</a>
            </div>
          </section>

          <section class="map-card" aria-label="地图预览">
            <div class="map-pin" aria-hidden="true"></div>
            <div class="map-info">
              <strong>${escapeHtml(record.name)}</strong>
              <span>${escapeHtml(record.address)}</span>
            </div>
          </section>

          <section class="section">
            <div class="section-title">备注</div>
            <div class="note-box">${escapeHtml(record.note || "还没有备注。")}</div>
          </section>
        </article>
      `;

      document.getElementById("editBtn").addEventListener("click", () => openForm(record.id));
      document.getElementById("deleteBtn").addEventListener("click", deleteSelected);
    }

    function render() {
      syncCategoryOptions();
      renderList();
    }

    function openForm(id = "") {
      const record = records.find(item => item.id === id);
      document.getElementById("formTitle").textContent = record ? "编辑收藏" : "添加收藏";
      document.getElementById("recordId").value = record?.id || "";
      document.getElementById("nameInput").value = record?.name || "";
      document.getElementById("addressInput").value = record?.address || "";
      document.getElementById("categoryInput").value = record?.category || "";
      document.getElementById("sourceInput").value = record?.source || "";
      document.getElementById("avgPriceInput").value = record?.avgPrice || "";
      document.getElementById("ratingInput").value = record?.rating || "";
      document.getElementById("mustEatInput").value = (record?.mustEat || []).join("\n");
      document.getElementById("noteInput").value = record?.note || "";
      formModal.classList.add("open");
      setTimeout(() => document.getElementById("nameInput").focus(), 0);
    }

    function closeForm() {
      formModal.classList.remove("open");
      foodForm.reset();
    }

    function readFormRecord() {
      const id = document.getElementById("recordId").value;
      const now = new Date().toISOString();
      const existing = records.find(item => item.id === id);
      return {
        id: id || createId(),
        name: document.getElementById("nameInput").value.trim(),
        address: document.getElementById("addressInput").value.trim(),
        category: document.getElementById("categoryInput").value,
        source: document.getElementById("sourceInput").value,
        avgPrice: Number(document.getElementById("avgPriceInput").value) || "",
        rating: Number(document.getElementById("ratingInput").value) || "",
        mustEat: document.getElementById("mustEatInput").value
          .split(/\n+/)
          .map(item => item.trim())
          .filter(Boolean),
        note: document.getElementById("noteInput").value.trim(),
        createdAt: existing?.createdAt || now,
        updatedAt: now
      };
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function deleteSelected() {
      const record = records.find(item => item.id === selectedId);
      if (!record) return;
      if (!confirm(`确定删除「${record.name}」吗？`)) return;
      records = records.filter(item => item.id !== selectedId);
      selectedId = records[0]?.id || "";
      saveRecords();
      render();
      showToast("已删除");
    }

    document.getElementById("addBtn").addEventListener("click", () => openForm());
    document.getElementById("closeModalBtn").addEventListener("click", closeForm);
    document.getElementById("cancelBtn").addEventListener("click", closeForm);
    searchInput.addEventListener("input", renderList);
    categoryFilter.addEventListener("change", renderList);

    formModal.addEventListener("click", event => {
      if (event.target === formModal) closeForm();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && formModal.classList.contains("open")) {
        closeForm();
      }
    });

    foodForm.addEventListener("submit", event => {
      event.preventDefault();
      const nextRecord = readFormRecord();
      if (!nextRecord.name || !nextRecord.address || !nextRecord.mustEat.length) {
        showToast("请补全店名、地址和必吃菜单");
        return;
      }

      const index = records.findIndex(item => item.id === nextRecord.id);
      if (index >= 0) {
        records[index] = nextRecord;
      } else {
        records.unshift(nextRecord);
      }
      selectedId = nextRecord.id;
      saveRecords();
      closeForm();
      render();
      showToast("已保存");
    });

    render();
  </script>
</body>
</html>
