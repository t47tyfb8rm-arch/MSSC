<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="美食收藏">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#df6d23">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <title>美食收藏</title>
  <style>
    :root {
      --bg: #fbfaf8;
      --text: #272321;
      --muted: #8d8a86;
      --soft: #f4f1ee;
      --line: #ebe7e2;
      --accent: #df6d23;
      --accent-2: #f0831f;
      --danger: #e54b3d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #ece9e4; scrollbar-width: none; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: #ece9e4; letter-spacing: 0; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar, .phone::-webkit-scrollbar { display: none; }
    button, input, textarea { font: inherit; }
    button { border: 0; cursor: pointer; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }
    .phone { width: min(100%, 430px); min-height: 100vh; margin: 0 auto; background: var(--bg); box-shadow: 0 0 42px rgba(37, 32, 28, .10); overflow: hidden; }
    .screen { min-height: 100vh; padding: 0 22px 28px; display: none; }
    .screen.active { display: block; }
    .top { position: sticky; top: 0; z-index: 3; margin: 0 -22px 12px; padding: calc(12px + env(safe-area-inset-top)) 22px 12px; background: rgba(251, 250, 248, .96); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(235, 231, 226, .84); }
    .app-nav { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .title-block h1 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 900; }
    .title-block p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .add-btn, .save-btn { min-height: 46px; border-radius: 8px; padding: 0 18px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 800; box-shadow: 0 12px 26px rgba(223, 109, 35, .22); white-space: nowrap; }
    .add-btn { width: 44px; height: 44px; min-height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; font-size: 25px; line-height: 1; }
    .save-btn { width: 100%; height: 58px; font-size: 20px; }
    .search { position: sticky; top: 76px; z-index: 2; height: 52px; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: grid; grid-template-columns: 1fr; align-items: center; gap: 8px; padding: 0 14px; box-shadow: 0 7px 18px rgba(60, 45, 32, .04); }
    .search input { width: 100%; border: 0; outline: none; color: var(--text); background: transparent; font-size: 14px; }
    .filter-btn { display: none; }
    .category-strip { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 6px; scrollbar-width: none; }
    .category-strip::-webkit-scrollbar { display: none; }
    .pill { flex: 0 0 auto; min-height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); color: #706b65; background: #fff; font-size: 12px; }
    .pill.active { border-color: rgba(223, 109, 35, .32); color: var(--accent); background: #fff3ea; font-weight: 800; }
    .stats { display: flex; align-items: center; gap: 8px; margin: 11px 0 8px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
    .stats::-webkit-scrollbar { display: none; }
    .stat { display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; }
    .stat:not(:last-child)::after { content: ""; width: 3px; height: 3px; margin-left: 8px; border-radius: 50%; background: #d8d1ca; }
    .stat strong { color: var(--accent); font-size: 13px; line-height: 1; font-weight: 900; }
    .stat span { color: var(--muted); font-size: 12px; line-height: 1; }
    .count { margin: 13px 0 10px; color: #332f2a; font-size: 15px; font-weight: 900; }
    .list { display: grid; min-width: 0; overflow: hidden; }
    .row { display: block; width: 100%; min-width: 0; overflow: hidden; text-align: left; padding: 14px 13px; margin-bottom: 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 8px 20px rgba(50, 39, 28, .045); }
    .row-top { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    .num { flex: 0 0 auto; min-width: 34px; height: 27px; border-radius: 999px; display: inline-grid; place-items: center; color: var(--accent); background: #fff3ea; font-size: 13px; font-weight: 900; }
    .thumb { width: 76px; height: 76px; border-radius: 8px; object-fit: cover; background: var(--soft); }
    .thumb-placeholder { width: 76px; height: 76px; border-radius: 8px; display: grid; place-items: center; color: #b76d22; background: linear-gradient(135deg, #fff2dd, #f8dfbd); font-size: 28px; font-weight: 900; }
    .row-main { min-width: 0; flex: 1; }
    .row-name { display: -webkit-box; font-size: 17px; line-height: 1.28; font-weight: 900; overflow: hidden; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .row-meta, .row-address { display: block; color: #7d7973; font-size: 13px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; }
    .row-address { display: -webkit-box; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .row-meta { margin-top: 7px; }
    .row-must { display: -webkit-box; margin-top: 10px; padding: 9px 11px; border-radius: 8px; color: var(--accent); background: #fff7ef; font-size: 13px; line-height: 1.45; overflow: hidden; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .row-address { margin-top: 7px; }
    .row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
    .row-action { min-width: 0; height: 36px; border-radius: 8px; display: grid; place-items: center; background: #f6f3ef; color: #4d4741; font-size: 13px; font-weight: 900; }
    .row-action.primary { color: #fff; background: var(--accent); }
    .chev { display: none; }
    .empty { margin-top: 54px; color: var(--muted); text-align: center; line-height: 1.7; }
    .nav-head { position: sticky; top: 0; z-index: 3; margin: 0 -22px 24px; padding: calc(12px + env(safe-area-inset-top)) 22px 12px; background: rgba(251, 250, 248, .96); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(235, 231, 226, .84); }
    .nav-row { display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; }
    .back { width: 42px; height: 42px; border-radius: 8px; font-size: 32px; line-height: 1; color: #3f3b37; }
    .nav-title { text-align: center; font-size: 20px; font-weight: 900; }
    .detail-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .detail-title h2 { margin: 0; font-size: 34px; line-height: 1.16; font-weight: 900; }
    .badge { flex: 0 0 auto; min-width: 56px; min-height: 36px; border-radius: 8px; display: grid; place-items: center; background: #ffedcf; color: #c77720; font-weight: 900; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 18px; color: #4f4b46; font-size: 15px; }
    .detail-note { color: #7a756f; line-height: 1.7; font-size: 16px; margin: 0 0 24px; }
    .info-list { display: grid; gap: 8px; margin: 0 0 24px; }
    .info-line { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #625d57; font-size: 14px; line-height: 1.45; }
    .info-line strong { color: #302d29; font-size: 14px; }
    .section { padding: 22px 0; border-top: 1px solid var(--line); }
    .section h3 { margin: 0 0 16px; font-size: 22px; font-weight: 900; }
    .dish-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .dish-tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .dish-tag { max-width: 100%; padding: 10px 12px; border-radius: 8px; color: #8f4f13; background: #fff3df; font-size: 15px; line-height: 1.35; font-weight: 900; }
    .dish img { width: 100%; aspect-ratio: 1 / .78; border-radius: 8px; object-fit: cover; background: var(--soft); }
    .dish strong { display: block; margin-top: 9px; font-size: 15px; line-height: 1.3; }
    .dish span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .address-line { display: grid; grid-template-columns: 1fr 28px; gap: 10px; align-items: center; color: #494541; font-size: 15px; line-height: 1.55; }
    .map { position: relative; overflow: hidden; height: 265px; margin-top: 14px; border-radius: 8px; border: 1px solid var(--line); background: #f1eee8; }
    .map > img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .map-info { position: absolute; left: 12px; right: 12px; bottom: 12px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 8px; background: rgba(255, 255, 255, .92); box-shadow: 0 10px 24px rgba(49, 38, 28, .12); }
    .map-info strong { display: block; font-size: 15px; line-height: 1.25; }
    .map-info span { display: block; margin-top: 4px; color: #7d7973; font-size: 12px; line-height: 1.35; }
    .nav-btn { min-height: 38px; border-radius: 999px; padding: 0 14px; background: #f1eee9; color: #4e4943; font-weight: 800; white-space: nowrap; display: inline-flex; align-items: center; }
    .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 18px; }
    .edit-btn, .delete-btn { height: 52px; border-radius: 8px; font-size: 17px; font-weight: 900; }
    .edit-btn { border: 1px solid #d8d0c8; background: #fff; }
    .delete-btn { color: #fff; background: var(--danger); }
    .form-row { display: grid; grid-template-columns: 82px 1fr; gap: 14px; align-items: start; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .form-row label { padding-top: 10px; color: #302d29; font-size: 18px; font-weight: 900; }
    .field { width: 100%; min-height: 44px; border: 0; outline: none; color: var(--text); background: transparent; font-size: 16px; }
    .lookup-line { display: grid; grid-template-columns: 1fr 72px; gap: 10px; align-items: center; }
    .lookup-btn { height: 42px; border-radius: 8px; color: #fff; background: var(--accent); font-size: 15px; font-weight: 900; white-space: nowrap; }
    .lookup-btn:disabled { opacity: .58; cursor: wait; }
    .poi-results { border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; }
    .poi-guide { padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--accent); background: #fff7ef; font-size: 13px; line-height: 1.45; font-weight: 800; }
    .poi-item { width: 100%; padding: 12px; border-bottom: 1px solid var(--line); text-align: left; background: #fff; }
    .poi-item:last-child { border-bottom: 0; }
    .poi-item strong { display: block; font-size: 15px; line-height: 1.35; }
    .poi-item span { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .source-note, .poi-item .source-note { display: block; margin-top: 5px; color: #9b948c; font-size: 12px; line-height: 1.35; }
    .poi-select { display: inline-flex; margin-top: 8px; padding: 5px 9px; border-radius: 999px; color: #fff; background: var(--accent); font-size: 12px; font-weight: 900; }
    .poi-empty { padding: 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .poi-empty button { margin-top: 10px; color: var(--accent); font-weight: 900; }
    textarea.field { min-height: 110px; padding-top: 10px; resize: vertical; line-height: 1.6; border: 1px solid var(--line); border-radius: 8px; padding-left: 12px; padding-right: 12px; background: #fff; }
    .dish-editor { display: grid; gap: 10px; }
    .dish-card { display: grid; grid-template-columns: 68px 1fr auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .dish-photo { width: 68px; height: 58px; border-radius: 8px; display: grid; place-items: center; color: #b76d22; background: linear-gradient(135deg, #fff2dd, #f8dfbd); font-size: 22px; font-weight: 900; overflow: hidden; }
    .dish .dish-photo { width: 100%; height: auto; aspect-ratio: 1 / .78; }
    .dish-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dish-name-input { width: 100%; min-height: 38px; border: 0; outline: none; color: var(--text); background: transparent; font-size: 16px; font-weight: 800; }
    .dish-actions { display: grid; gap: 7px; }
    .tiny-btn { min-width: 46px; height: 30px; border-radius: 8px; background: #f4f1ee; color: #5b554f; font-size: 12px; font-weight: 900; }
    .tiny-btn.danger { color: #fff; background: var(--danger); }
    .add-dish-btn { width: 100%; height: 42px; border-radius: 8px; color: var(--accent); background: #fff3ea; font-size: 15px; font-weight: 900; }
    .mini-map { overflow: hidden; margin-top: 8px; height: 146px; border-radius: 8px; border: 1px solid var(--line); background: #f1eee8; }
    .mini-map img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fixed-actions { position: sticky; bottom: 0; z-index: 2; margin: 18px -22px 0; padding: 12px 22px calc(14px + env(safe-area-inset-bottom)); background: rgba(251, 250, 248, .94); backdrop-filter: blur(18px); border-top: 1px solid rgba(235, 231, 226, .86); }
    .cancel-link { display: block; width: 100%; margin-top: 18px; color: var(--muted); font-size: 16px; text-align: center; }
    .sheet { position: fixed; inset: 0; z-index: 8; display: none; align-items: end; justify-content: center; background: rgba(23, 20, 18, .28); }
    .sheet.show { display: flex; }
    .sheet-panel { width: min(430px, 100%); max-height: 72vh; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 8px 8px 0 0; background: var(--bg); box-shadow: 0 -18px 40px rgba(30, 24, 18, .18); overflow: auto; }
    .sheet-head { position: sticky; top: -12px; z-index: 1; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: -12px -16px 12px; padding: 12px 16px; background: rgba(251, 250, 248, .96); border-bottom: 1px solid var(--line); }
    .sheet-title { text-align: center; font-size: 18px; font-weight: 900; }
    .sheet-close { width: 40px; height: 40px; border-radius: 8px; color: var(--muted); font-size: 26px; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 5; max-width: min(360px, calc(100vw - 32px)); transform: translateX(-50%) translateY(18px); opacity: 0; pointer-events: none; padding: 11px 14px; border-radius: 8px; color: #fff; background: rgba(30, 28, 26, .92); box-shadow: 0 12px 28px rgba(0,0,0,.18); transition: .2s ease; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .mode-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 4px; scrollbar-width: none; }
    .mode-tabs::-webkit-scrollbar { display: none; }
    .mode-tab { flex: 0 0 auto; min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #625c55; font-size: 12px; font-weight: 900; }
    .mode-tab.active { border-color: rgba(223, 109, 35, .36); color: var(--accent); background: #fff3ea; }
    .mode-hint { min-height: 16px; margin: 0 0 6px; color: #aaa29a; font-size: 11px; line-height: 1.4; }
    .row.closed { background: #f1eee9; color: #77716f; }
    .row.closed::after { content: "该门店已标记闭店"; position: absolute; inset: 0; display: grid; place-items: center; color: #5f5952; background: rgba(238, 235, 230, .72); font-size: 13px; font-weight: 900; pointer-events: none; }
    .row { position: relative; }
    .row-source { display: block; margin-top: 5px; color: #aaa29a; font-size: 11px; line-height: 1.35; }
    .row-actions { grid-template-columns: 1fr 1fr 42px; }
    .menu-list { display: grid; gap: 8px; }
    .menu-list button { min-height: 44px; border-radius: 8px; background: #fff; color: #3d3832; font-size: 14px; font-weight: 900; }
    .detail-hero { overflow: hidden; margin: -24px -22px 18px; background: #fff; }
    .detail-hero-media { position: relative; height: 214px; display: grid; place-items: center; overflow: hidden; background: linear-gradient(135deg, #fff0d6, #f4d2a2); color: #b76d22; font-size: 42px; font-weight: 900; }
    .detail-hero-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-badge { position: absolute; left: 12px; bottom: 12px; padding: 3px 8px; border-radius: 999px; color: #fff; background: rgba(28, 24, 20, .58); font-size: 11px; font-weight: 800; }
    .detail-hero-body { padding: 16px 22px 18px; }
    .ai-panel { padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .ai-panel small { display: block; margin: -8px 0 10px; color: #aaa29a; font-size: 11px; }
    .ai-box { color: #67615a; font-size: 14px; line-height: 1.7; }
    .ai-box ul { margin: 8px 0 0; padding-left: 18px; }
    .stars { display: flex; gap: 6px; }
    .star { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: #c3a577; background: #f3eee8; font-size: 20px; }
    .star.active { color: #fff; background: var(--accent); }
    .checked { color: #2f8c62; font-size: 13px; font-weight: 900; }
    .form-card { margin: 0 0 12px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .form-card h3 { margin: 0 0 10px; font-size: 16px; font-weight: 900; }
    .form-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .map-tag { position: absolute; right: 8px; bottom: 8px; padding: 4px 7px; border-radius: 999px; color: #746e67; background: rgba(255,255,255,.92); font-size: 11px; font-weight: 800; }
    .mini-map { position: relative; }
    /* v4 App visual refresh */
    :root {
      --bg: #F7F7F9;
      --soft: #F2F2F4;
      --line: #ECECEF;
      --text: #202124;
      --muted: #666666;
      --accent: #F2761D;
      --accent-2: #FF8A1F;
    }
    body { background: #E9E9ED; }
    .phone { background: var(--bg); box-shadow: 0 12px 48px rgba(0,0,0,.16); }
    .screen { padding-left: 16px; padding-right: 16px; }
    .top { margin-left: -16px; margin-right: -16px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(247,247,249,.95); border-bottom: 0; }
    .app-nav { align-items: center; }
    .title-block h1 { font-size: 28px; letter-spacing: 0; font-weight: 950; }
    .title-block p { margin-top: 3px; font-size: 13px; color: #8B8B90; }
    .add-btn { width: 52px; height: 52px; min-height: 52px; border-radius: 50%; font-size: 30px; background: linear-gradient(145deg, #FF8A1F, #EC6F17); box-shadow: 0 10px 22px rgba(242,118,29,.34), 0 2px 6px rgba(0,0,0,.12); }
    .search { top: 76px; height: 48px; margin: 12px 0 10px; border: 0; border-radius: 12px; background: #F2F2F4; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 4px 12px rgba(0,0,0,.04); padding: 0 14px; }
    .search input { font-size: 15px; color: #303033; }
    .mode-tabs { gap: 9px; padding: 4px 0 8px; }
    .mode-tab, .pill { min-height: 36px; padding: 0 15px; border: 0; border-radius: 18px; background: #ECECEF; color: #4E4E53; font-size: 13px; box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }
    .mode-tab.active, .pill.active { color: #fff; background: linear-gradient(145deg, #FF8A1F, #F2761D); box-shadow: 0 5px 12px rgba(242,118,29,.22); }
    .mode-hint { margin: -2px 2px 8px; color: #8C8C92; }
    .category-strip { gap: 9px; padding: 2px 0 8px; }
    .stats { margin: 8px 0 8px; padding: 0 2px; }
    .stat strong { color: #F2761D; }
    .count { margin: 12px 2px 9px; font-size: 16px; color: #252528; }
    .list { gap: 10px; overflow: visible; }
    .row { padding: 13px; margin-bottom: 0; border: 0; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .row-top { gap: 10px; align-items: flex-start; }
    .num { min-width: 38px; height: 26px; border-radius: 999px; background: #FFF0E2; color: #F2761D; font-size: 13px; box-shadow: inset 0 1px 0 rgba(255,255,255,.9); }
    .row-name { font-size: 18px; line-height: 1.25; color: #202124; font-weight: 950; }
    .row-meta, .row-address { font-size: 12px; color: #666666; line-height: 1.45; }
    .row-source { color: #9A9AA0; }
    .row-must { margin-top: 10px; padding: 8px 10px; border-radius: 8px; color: #C45F16; background: #FFF3E8; font-size: 12px; }
    .row-address { margin-top: 8px; }
    .row-actions { grid-template-columns: 1fr 1fr 36px; gap: 9px; margin-top: 11px; }
    .row-action { height: 38px; border-radius: 12px; background: #F4F4F6; color: #55555A; font-size: 13px; box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
    .row-action.primary { color: #fff; background: linear-gradient(145deg, #FF8A1F, #F2761D); box-shadow: 0 6px 14px rgba(242,118,29,.24); }
    .row-actions .row-action:last-child { width: 36px; padding: 0; border-radius: 12px; font-size: 18px; color: #6B6B70; background: #F2F2F4; }

    addDishBtn.addEventListener("click", () => addDish());
    aiDishBtn.addEventListener("click", aiRecommendDishes);
    document.getElementById("shopPhotoBtn").addEventListener("click", () => shopPhotoInput.click());
    document.getElementById("toggleClosedBtn").addEventListener("click", () => { const input = document.getElementById("closedInput"); input.value = input.value === "1" ? "" : "1"; document.getElementById("toggleClosedBtn").textContent = input.value === "1" ? "取消闭店标记" : "标记闭店"; });
    dishPhotoInput.addEventListener("change", async event => { const file = event.target.files?.[0]; if (!file || editingDishIndex < 0) return; try { formDishes[editingDishIndex].photo = await compressImage(file); renderDishEditor(); showToast("图片已上传"); } catch { showToast("图片处理失败"); } finally { event.target.value = ""; editingDishIndex = -1; } });
    shopPhotoInput.addEventListener("change", async event => { const file = event.target.files?.[0]; if (!file) return; try { const photo = await compressImage(file); if (formScreen.classList.contains("active")) { document.getElementById("photoInput").value = photo; showToast("门店实拍图已上传"); } else if (menuRecordId) { const record = records.find(item => item.id === menuRecordId); if (record) { record.photo = photo; record.photoSource = "我的上传"; saveRecords(); renderList(); showToast("门店实拍图已上传"); } } } catch { showToast("图片处理失败"); } finally { event.target.value = ""; } });
    nameInput.addEventListener("keydown", event => { if (event.key === "Enter") { event.preventDefault(); searchPoi(); } });
    addressInput.addEventListener("blur", geocodeAddress);
    document.querySelectorAll('[data-action="back"]').forEach(button => button.addEventListener("click", closeForm));
    let detailSwipeStartX = 0;
    let detailSwipeStartY = 0;
    let detailSwipeActive = false;
    function prepareSwipeUnderlay() {
      renderList();
      listScreen.classList.add("swipe-underlay");
    }
    function resetDetailSwipe() {
      detailSwipeActive = false;
      detailScreen.classList.remove("swiping", "swipe-leave");
      listScreen.classList.remove("swipe-underlay");
      detailScreen.style.transform = "";
      detailScreen.style.opacity = "";
    }
    detailScreen.addEventListener("touchstart", event => {
      const touch = event.touches?.[0];
      if (!touch || !detailScreen.classList.contains("active")) return;
      detailSwipeStartX = touch.clientX;
      detailSwipeStartY = touch.clientY;
      detailSwipeActive = detailSwipeStartX < 38;
      if (detailSwipeActive) {
        prepareSwipeUnderlay();
        detailScreen.classList.add("swiping");
      }
    }, { passive: true });
    detailScreen.addEventListener("touchmove", event => {
      if (!detailSwipeActive) return;
      const touch = event.touches?.[0];
      if (!touch) return;
      const dx = Math.max(0, touch.clientX - detailSwipeStartX);
      const dy = Math.abs(touch.clientY - detailSwipeStartY);
      if (dy > 58 && dx < 42) {
        resetDetailSwipe();
        return;
      }
      const offset = Math.min(dx, 190);
      detailScreen.style.transform = `translateX(${offset}px)`;
      detailScreen.style.opacity = String(Math.max(.74, 1 - dx / 420));
    }, { passive: true });
    detailScreen.addEventListener("touchend", event => {
      if (!detailSwipeActive) return;
      const touch = event.changedTouches?.[0];
      const dx = touch ? touch.clientX - detailSwipeStartX : 0;
      const dy = touch ? Math.abs(touch.clientY - detailSwipeStartY) : 0;
      detailScreen.classList.remove("swiping");
      if (dx > 88 && dy < 62) {
        detailScreen.classList.add("swipe-leave");
        detailScreen.style.transform = "translateX(100%)";
        detailScreen.style.opacity = ".28";
        window.setTimeout(() => {
          renderList();
          showScreen("list");
          resetDetailSwipe();
        }, 180);
        return;
      }
      detailScreen.style.transform = "translateX(0)";
      detailScreen.style.opacity = "1";
      window.setTimeout(resetDetailSwipe, 230);
    }, { passive: true });
    detailScreen.addEventListener("touchcancel", resetDetailSwipe, { passive: true });
    resetBtn.addEventListener("click", () => openForm(document.getElementById("recordId").value));
    form.addEventListener("submit", event => { event.preventDefault(); const nextRecord = readForm(); if (!nextRecord.name) { showToast("请输入店铺名称"); return; } if (!nextRecord.address) { showToast("请输入详细地址"); return; } saveBtn.disabled = true; saveBtn.textContent = "正在保存…"; try { const index = records.findIndex(item => item.id === nextRecord.id); if (index >= 0) records[index] = nextRecord; else records.unshift(nextRecord); selectedId = nextRecord.id; saveRecords(); renderList(); renderDetail(); showScreen("detail"); showToast("已保存收藏"); } finally { saveBtn.disabled = false; saveBtn.textContent = "保存收藏"; } });
    renderList();
  </script>
</body>
</html>
