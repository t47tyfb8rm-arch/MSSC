<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="美食收藏">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#df6d23">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <title>美食收藏</title>
  <style>
    :root {
      --bg: #fbfaf8;
      --text: #272321;
      --muted: #8d8a86;
      --soft: #f4f1ee;
      --line: #ebe7e2;
      --accent: #df6d23;
      --accent-2: #f0831f;
      --danger: #e54b3d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #ece9e4; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: #ece9e4; letter-spacing: 0; }
    button, input, textarea { font: inherit; }
    button { border: 0; cursor: pointer; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }
    .phone { width: min(100%, 430px); min-height: 100vh; margin: 0 auto; background: var(--bg); box-shadow: 0 0 42px rgba(37, 32, 28, .10); overflow: hidden; }
    .screen { min-height: 100vh; padding: 0 22px 28px; display: none; }
    .screen.active { display: block; }
    .top { position: sticky; top: 0; z-index: 3; margin: 0 -22px 14px; padding: calc(14px + env(safe-area-inset-top)) 22px 14px; background: rgba(251, 250, 248, .96); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(235, 231, 226, .84); }
    .app-nav { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .title-block h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 900; }
    .title-block p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .add-btn, .save-btn { min-height: 48px; border-radius: 8px; padding: 0 18px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 800; box-shadow: 0 12px 26px rgba(223, 109, 35, .22); white-space: nowrap; }
    .add-btn { font-size: 16px; }
    .save-btn { width: 100%; height: 58px; font-size: 20px; }
    .search { position: sticky; top: 82px; z-index: 2; height: 52px; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 0 14px; box-shadow: 0 7px 18px rgba(60, 45, 32, .04); }
    .search input { width: 100%; border: 0; outline: none; color: var(--text); background: transparent; font-size: 15px; }
    .filter-btn { width: 54px; height: 36px; border-radius: 8px; color: #6e6a65; background: #f7f5f2; font-weight: 800; }
    .category-strip { display: none; gap: 8px; overflow-x: auto; padding: 14px 0 2px; scrollbar-width: none; }
    .category-strip.show { display: flex; }
    .category-strip::-webkit-scrollbar { display: none; }
    .pill { flex: 0 0 auto; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); color: #706b65; background: #fff; font-size: 13px; }
    .pill.active { border-color: rgba(223, 109, 35, .32); color: var(--accent); background: #fff3ea; font-weight: 800; }
    .count { margin: 26px 0 18px; color: #5f5b56; font-size: 15px; }
    .list { display: grid; }
    .row { display: grid; grid-template-columns: 28px 76px 1fr 18px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 13px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 8px 22px rgba(50, 39, 28, .05); }
    .num { color: var(--accent); font-size: 28px; font-weight: 900; text-align: left; }
    .thumb { width: 76px; height: 76px; border-radius: 8px; object-fit: cover; background: var(--soft); }
    .thumb-placeholder { width: 76px; height: 76px; border-radius: 8px; display: grid; place-items: center; color: #b76d22; background: linear-gradient(135deg, #fff2dd, #f8dfbd); font-size: 28px; font-weight: 900; }
    .row-main { min-width: 0; }
    .row-name { display: -webkit-box; font-size: 18px; line-height: 1.25; font-weight: 900; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .row-meta, .row-address { display: block; color: #7d7973; font-size: 14px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-meta { margin-top: 7px; }
    .row-must { display: block; margin-top: 6px; color: var(--accent); font-size: 14px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-address { margin-top: 7px; }
    .chev { color: #8b8781; font-size: 28px; line-height: 1; }
    .empty { margin-top: 54px; color: var(--muted); text-align: center; line-height: 1.7; }
    .nav-head { position: sticky; top: 0; z-index: 3; margin: 0 -22px 24px; padding: calc(12px + env(safe-area-inset-top)) 22px 12px; background: rgba(251, 250, 248, .96); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(235, 231, 226, .84); }
    .nav-row { display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; }
    .back { width: 42px; height: 42px; border-radius: 8px; font-size: 32px; line-height: 1; color: #3f3b37; }
    .nav-title { text-align: center; font-size: 20px; font-weight: 900; }
    .detail-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .detail-title h2 { margin: 0; font-size: 34px; line-height: 1.16; font-weight: 900; }
    .badge { flex: 0 0 auto; min-width: 56px; min-height: 36px; border-radius: 8px; display: grid; place-items: center; background: #ffedcf; color: #c77720; font-weight: 900; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 18px; color: #4f4b46; font-size: 15px; }
    .detail-note { color: #7a756f; line-height: 1.7; font-size: 16px; margin: 0 0 24px; }
    .section { padding: 22px 0; border-top: 1px solid var(--line); }
    .section h3 { margin: 0 0 16px; font-size: 22px; font-weight: 900; }
    .dish-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .dish img { width: 100%; aspect-ratio: 1 / .78; border-radius: 8px; object-fit: cover; background: var(--soft); }
    .dish strong { display: block; margin-top: 9px; font-size: 15px; line-height: 1.3; }
    .dish span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .address-line { display: grid; grid-template-columns: 1fr 28px; gap: 10px; align-items: center; color: #494541; font-size: 15px; line-height: 1.55; }
    .map { position: relative; overflow: hidden; height: 265px; margin-top: 14px; border-radius: 8px; border: 1px solid var(--line); background: #f1eee8; }
    .map > img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .map-info { position: absolute; left: 12px; right: 12px; bottom: 12px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 8px; background: rgba(255, 255, 255, .92); box-shadow: 0 10px 24px rgba(49, 38, 28, .12); }
    .map-info strong { display: block; font-size: 15px; line-height: 1.25; }
    .map-info span { display: block; margin-top: 4px; color: #7d7973; font-size: 12px; line-height: 1.35; }
    .nav-btn { min-height: 38px; border-radius: 999px; padding: 0 14px; background: #f1eee9; color: #4e4943; font-weight: 800; white-space: nowrap; display: inline-flex; align-items: center; }
    .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 18px; }
    .edit-btn, .delete-btn { height: 52px; border-radius: 8px; font-size: 17px; font-weight: 900; }
    .edit-btn { border: 1px solid #d8d0c8; background: #fff; }
    .delete-btn { color: #fff; background: var(--danger); }
    .form-row { display: grid; grid-template-columns: 82px 1fr; gap: 14px; align-items: start; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .form-row label { padding-top: 10px; color: #302d29; font-size: 18px; font-weight: 900; }
    .field { width: 100%; min-height: 44px; border: 0; outline: none; color: var(--text); background: transparent; font-size: 16px; }
    .lookup-line { display: grid; grid-template-columns: 1fr 72px; gap: 10px; align-items: center; }
    .lookup-btn { height: 42px; border-radius: 8px; color: #fff; background: var(--accent); font-size: 15px; font-weight: 900; white-space: nowrap; }
    .lookup-btn:disabled { opacity: .58; cursor: wait; }
    .poi-results { border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; }
    .poi-guide { padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--accent); background: #fff7ef; font-size: 13px; line-height: 1.45; font-weight: 800; }
    .poi-item { width: 100%; padding: 12px; border-bottom: 1px solid var(--line); text-align: left; background: #fff; }
    .poi-item:last-child { border-bottom: 0; }
    .poi-item strong { display: block; font-size: 15px; line-height: 1.35; }
    .poi-item span { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .poi-select { display: inline-flex; margin-top: 8px; padding: 5px 9px; border-radius: 999px; color: #fff; background: var(--accent); font-size: 12px; font-weight: 900; }
    .poi-empty { padding: 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    textarea.field { min-height: 110px; padding-top: 10px; resize: vertical; line-height: 1.6; border: 1px solid var(--line); border-radius: 8px; padding-left: 12px; padding-right: 12px; background: #fff; }
    .dish-editor { display: grid; gap: 10px; }
    .dish-card { display: grid; grid-template-columns: 68px 1fr auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .dish-photo { width: 68px; height: 58px; border-radius: 8px; display: grid; place-items: center; color: #b76d22; background: linear-gradient(135deg, #fff2dd, #f8dfbd); font-size: 22px; font-weight: 900; overflow: hidden; }
    .dish .dish-photo { width: 100%; height: auto; aspect-ratio: 1 / .78; }
    .dish-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dish-name-input { width: 100%; min-height: 38px; border: 0; outline: none; color: var(--text); background: transparent; font-size: 16px; font-weight: 800; }
    .dish-actions { display: grid; gap: 7px; }
    .tiny-btn { min-width: 46px; height: 30px; border-radius: 8px; background: #f4f1ee; color: #5b554f; font-size: 12px; font-weight: 900; }
    .tiny-btn.danger { color: #fff; background: var(--danger); }
    .add-dish-btn { width: 100%; height: 42px; border-radius: 8px; color: var(--accent); background: #fff3ea; font-size: 15px; font-weight: 900; }
    .mini-map { overflow: hidden; margin-top: 8px; height: 146px; border-radius: 8px; border: 1px solid var(--line); background: #f1eee8; }
    .mini-map img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fixed-actions { position: sticky; bottom: 0; z-index: 2; margin: 18px -22px 0; padding: 12px 22px calc(14px + env(safe-area-inset-bottom)); background: rgba(251, 250, 248, .94); backdrop-filter: blur(18px); border-top: 1px solid rgba(235, 231, 226, .86); }
    .cancel-link { display: block; width: 100%; margin-top: 18px; color: var(--muted); font-size: 16px; text-align: center; }
    .sheet { position: fixed; inset: 0; z-index: 8; display: none; align-items: end; justify-content: center; background: rgba(23, 20, 18, .28); }
    .sheet.show { display: flex; }
    .sheet-panel { width: min(430px, 100%); max-height: 72vh; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 8px 8px 0 0; background: var(--bg); box-shadow: 0 -18px 40px rgba(30, 24, 18, .18); overflow: auto; }
    .sheet-head { position: sticky; top: -12px; z-index: 1; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: -12px -16px 12px; padding: 12px 16px; background: rgba(251, 250, 248, .96); border-bottom: 1px solid var(--line); }
    .sheet-title { text-align: center; font-size: 18px; font-weight: 900; }
    .sheet-close { width: 40px; height: 40px; border-radius: 8px; color: var(--muted); font-size: 26px; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 5; max-width: min(360px, calc(100vw - 32px)); transform: translateX(-50%) translateY(18px); opacity: 0; pointer-events: none; padding: 11px 14px; border-radius: 8px; color: #fff; background: rgba(30, 28, 26, .92); box-shadow: 0 12px 28px rgba(0,0,0,.18); transition: .2s ease; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 370px) {
      .screen { padding-left: 16px; padding-right: 16px; }
      .row { grid-template-columns: 28px 82px 1fr 18px; gap: 10px; }
      .thumb { width: 82px; height: 82px; }
      .title-block h1 { font-size: 26px; }
      .detail-title h2 { font-size: 30px; }
      .dish-grid { grid-template-columns: 1fr 1fr; }
      .form-row { grid-template-columns: 72px 1fr; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <section class="screen active" id="listScreen">
      <header class="top">
        <div class="app-nav"><div class="title-block"><h1>美食收藏</h1><p>记录值得一吃的好味道</p></div><button class="add-btn" id="addBtn" type="button">+ 添加</button></div>
      </header>
      <div class="search"><input id="searchInput" type="search" placeholder="搜索餐厅名、菜品或地址"><button class="filter-btn" id="filterBtn" type="button">分类</button></div>
      <div class="category-strip" id="categoryStrip"></div>
      <div class="count" id="countText">共 0 家</div>
      <div class="list" id="recordList"></div>
    </section>
    <section class="screen" id="detailScreen"></section>
    <section class="screen" id="formScreen">
      <header class="nav-head"><div class="nav-row"><button class="back" type="button" data-action="back">‹</button><div class="nav-title" id="formTitle">添加收藏</div><span></span></div></header>
      <form id="recordForm">
        <input type="hidden" id="recordId">
        <input type="hidden" id="locationInput">
        <div class="form-row"><label for="nameInput">店名</label><div><div class="lookup-line"><input class="field" id="nameInput" required placeholder="请输入店名"><button class="lookup-btn" id="poiSearchBtn" type="button">搜店</button></div></div></div>
        <div class="form-row"><label for="addressInput">地址</label><div><input class="field" id="addressInput" required placeholder="请输入详细地址"><div class="mini-map"><img id="formMapImg" src="map-preview.jpg" alt="地图预览"></div></div></div>
        <div class="form-row"><label>必吃</label><div><div class="dish-editor" id="dishEditor"></div><button class="add-dish-btn" id="addDishBtn" type="button">+ 添加必吃菜</button><input id="dishPhotoInput" type="file" accept="image/*" hidden></div></div>
        <div class="form-row"><label for="sourceInput">来源</label><input class="field" id="sourceInput" placeholder="例如：朋友推荐 / 小红书 / 大众点评"></div>
        <div class="form-row"><label for="categoryInput">分类</label><input class="field" id="categoryInput" placeholder="例如：烧烤 / 面馆 / 火锅"></div>
        <div class="form-row"><label for="avgPriceInput">人均</label><input class="field" id="avgPriceInput" inputmode="numeric" type="number" min="0" placeholder="例如：120 元"></div>
        <div class="form-row"><label for="noteInput">备注</label><textarea class="field" id="noteInput" placeholder="可填写环境、营业时间、停车等信息"></textarea></div>
        <div class="fixed-actions"><button class="save-btn" type="submit">保存</button><button class="cancel-link" type="button" data-action="back">取消</button></div>
      </form>
    </section>
  </div>
  <div class="sheet" id="poiSheet">
    <div class="sheet-panel">
      <div class="sheet-head"><span></span><div class="sheet-title">选择店铺</div><button class="sheet-close" id="poiSheetClose" type="button">×</button></div>
      <div class="poi-results" id="poiResults"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const STORAGE_KEY = "mssc.deploy.records.v2";
    const SEEDED_KEY = "mssc.deploy.seeded.v2";
    const AMAP_KEY = "f9984d1012e34ce9b78b41e973ce1c41";
    const AMAP_CITY = "上海";
    const listScreen = document.getElementById("listScreen");
    const detailScreen = document.getElementById("detailScreen");
    const formScreen = document.getElementById("formScreen");
    const recordList = document.getElementById("recordList");
    const searchInput = document.getElementById("searchInput");
    const categoryStrip = document.getElementById("categoryStrip");
    const countText = document.getElementById("countText");
    const toast = document.getElementById("toast");
    const form = document.getElementById("recordForm");
    const nameInput = document.getElementById("nameInput");
    const addressInput = document.getElementById("addressInput");
    const poiSearchBtn = document.getElementById("poiSearchBtn");
    const poiSheet = document.getElementById("poiSheet");
    const poiSheetClose = document.getElementById("poiSheetClose");
    const poiResults = document.getElementById("poiResults");
    const dishEditor = document.getElementById("dishEditor");
    const addDishBtn = document.getElementById("addDishBtn");
    const dishPhotoInput = document.getElementById("dishPhotoInput");
    const photos = ["food-roast.jpg", "food-noodles.jpg", "food-bbq.jpg"];
    const seedRecords = [
      { id: createId(), name: "松江夜油边", category: "本帮菜", avgPrice: 65, source: "朋友推荐", address: "上海市松江区中山中路 123 弄 6 号", mustEat: ["油边大肠", "红烧肉", "咸菜毛豆"], note: "朋友说油边酥香入味，夜宵首选。", photo: photos[0], createdAt: "2026-08-10T04:00:00.000Z", updatedAt: "2026-08-10T04:00:00.000Z" },
      { id: createId(), name: "阿婆葱油拌面", category: "小吃快餐", avgPrice: 18, source: "网上刷到", address: "上海市静安区愚园路 68 弄 2 号", mustEat: ["葱油拌面", "辣肉酱", "蛋汤"], note: "刷到好几次，路过附近可以试。", photo: photos[1], createdAt: "2026-08-09T11:30:00.000Z", updatedAt: "2026-08-09T11:30:00.000Z" },
      { id: createId(), name: "小林炭火烧肉", category: "日式烧肉", avgPrice: 128, source: "朋友推荐", address: "上海市长宁区天山西路 789 号", mustEat: ["和牛上肩", "厚切牛舌", "炭烤五花"], note: "适合周末晚上去，肉质看起来很稳。", photo: photos[2], createdAt: "2026-08-08T12:20:00.000Z", updatedAt: "2026-08-08T12:20:00.000Z" }
    ];
    let records = loadRecords();
    let selectedId = records[0]?.id || "";
    let activeCategory = "";
    let previousScreen = "list";
    let poiCandidates = [];
    let formDishes = [];
    let editingDishIndex = -1;
    function createId() { if (window.crypto?.randomUUID) return window.crypto.randomUUID(); return `mssc-${Date.now()}-${Math.random().toString(16).slice(2)}`; }
    function loadRecords() { const raw = localStorage.getItem(STORAGE_KEY); if (raw) { try { const parsed = JSON.parse(raw); return Array.isArray(parsed) ? parsed : []; } catch { return []; } } if (!localStorage.getItem(SEEDED_KEY)) { localStorage.setItem(SEEDED_KEY, "1"); localStorage.setItem(STORAGE_KEY, JSON.stringify(seedRecords)); return seedRecords; } return []; }
    function saveRecords() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
    function escapeHtml(value) { return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); }
    function normalizeDishes(value) { return (Array.isArray(value) ? value : []).map(item => typeof item === "string" ? { name: item, photo: "" } : { name: item?.name || "", photo: item?.photo || "" }).filter(item => item.name || item.photo); }
    function getDishNames(value) { return normalizeDishes(value).map(item => item.name).filter(Boolean); }
    function showScreen(name) { listScreen.classList.toggle("active", name === "list"); detailScreen.classList.toggle("active", name === "detail"); formScreen.classList.toggle("active", name === "form"); window.scrollTo({ top: 0, behavior: "instant" }); }
    function sortedRecords() { return [...records].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)); }
    function filteredRecords() { const keyword = searchInput.value.trim().toLowerCase(); return sortedRecords().filter(record => { const text = [record.name, record.category, record.address, record.source, record.note, ...getDishNames(record.mustEat)].join(" ").toLowerCase(); return (!keyword || text.includes(keyword)) && (!activeCategory || record.category === activeCategory); }); }
    function renderCategories() { const categories = Array.from(new Set(records.map(item => item.category).filter(Boolean))); categoryStrip.innerHTML = [`<button class="pill ${activeCategory === "" ? "active" : ""}" data-category="">全部</button>`, ...categories.map(category => `<button class="pill ${activeCategory === category ? "active" : ""}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`)].join(""); categoryStrip.querySelectorAll(".pill").forEach(button => button.addEventListener("click", () => { activeCategory = button.dataset.category || ""; renderList(); })); }
    function renderList() { renderCategories(); const items = filteredRecords(); countText.textContent = `共 ${items.length} 家`; if (!items.length) { recordList.innerHTML = `<div class="empty">还没有匹配的收藏。<br>点右上角添加第一家想吃的店。</div>`; return; } recordList.innerHTML = items.map((record, index) => { const mustEat = getDishNames(record.mustEat).slice(0, 3).join("、"); const cover = normalizeDishes(record.mustEat).find(item => item.photo)?.photo; const thumb = cover ? `<img class="thumb" src="${escapeHtml(cover)}" alt="${escapeHtml(record.name)}">` : `<span class="thumb-placeholder">${escapeHtml((record.name || "味").slice(0, 1))}</span>`; return `<button class="row" type="button" data-id="${record.id}"><span class="num">${index + 1}</span>${thumb}<span class="row-main"><strong class="row-name">${escapeHtml(record.name)}</strong><span class="row-meta">${escapeHtml(record.category || "未分类")} · 人均 ¥${escapeHtml(record.avgPrice || "-")}</span><span class="row-must">必吃：${escapeHtml(mustEat || "待补充")}</span><span class="row-address">${escapeHtml(record.address)}</span></span><span class="chev">›</span></button>`; }).join(""); recordList.querySelectorAll(".row").forEach(row => row.addEventListener("click", () => openDetail(row.dataset.id))); }
    function openDetail(id) { selectedId = id; renderDetail(); showScreen("detail"); }
    function getMapImage(location) { return location ? `https://restapi.amap.com/v3/staticmap?location=${encodeURIComponent(location)}&zoom=16&size=600*360&markers=mid,,A:${encodeURIComponent(location)}&key=${AMAP_KEY}` : "map-preview.jpg"; }
    function getMapLink(record) { return record.location ? `https://uri.amap.com/marker?position=${encodeURIComponent(record.location)}&name=${encodeURIComponent(record.name)}` : `https://ditu.amap.com/search?query=${encodeURIComponent(record.address)}`; }
    function updateFormMap(location) { const image = document.getElementById("formMapImg"); image.onerror = () => { image.onerror = null; image.src = "map-preview.jpg"; }; image.src = getMapImage(location); }
    function renderDetail() { const record = records.find(item => item.id === selectedId); if (!record) { showScreen("list"); renderList(); return; } const mapUrl = getMapLink(record); const mapImage = getMapImage(record.location); const dishes = normalizeDishes(record.mustEat).slice(0, 6); const dishSection = dishes.length ? `<div class="dish-grid">${dishes.map((dish, index) => `<div class="dish">${dish.photo ? `<img src="${escapeHtml(dish.photo)}" alt="${escapeHtml(dish.name)}">` : `<div class="dish-photo">${escapeHtml(dish.name.slice(0, 1) || "味")}</div>`}<strong>${escapeHtml(dish.name || "未命名")}</strong><span>${index === 0 ? "必点" : "值得试试"}</span></div>`).join("")}</div>` : `<p class="detail-note">还没有填写必吃菜。</p>`; detailScreen.innerHTML = `<header class="nav-head"><div class="nav-row"><button class="back" type="button" data-action="list">‹</button><span></span><span class="badge">#${Math.max(1, sortedRecords().findIndex(item => item.id === record.id) + 1)}</span></div></header><div class="detail-title"><h2>${escapeHtml(record.name)}</h2></div><div class="detail-meta"><span>${escapeHtml(record.category || "未分类")}</span><span>·</span><span>人均 ¥${escapeHtml(record.avgPrice || "-")}</span><span>·</span><span>来源：${escapeHtml(record.source || "未记录")}</span></div><p class="detail-note">${escapeHtml(record.note || "还没有备注。")}</p><section class="section"><h3>必吃推荐</h3>${dishSection}</section><section class="section"><h3>地址</h3><a class="address-line" href="${mapUrl}" target="_blank" rel="noopener"><span>${escapeHtml(record.address)}</span><span class="chev">›</span></a><div class="map"><img src="${escapeHtml(mapImage)}" alt="地图预览" onerror="this.onerror=null;this.src='map-preview.jpg'"><div class="map-info"><span><strong>${escapeHtml(record.name)}</strong><span>${escapeHtml(record.address)}</span></span><a class="nav-btn" href="${mapUrl}" target="_blank" rel="noopener">导航</a></div></div></section><section class="section"><h3>备注</h3><p class="detail-note">${escapeHtml(record.note || "还没有备注。")}</p></section><div class="detail-actions"><button class="edit-btn" type="button" data-action="edit">编辑</button><button class="delete-btn" type="button" data-action="delete">删除</button></div>`; detailScreen.querySelector('[data-action="list"]').addEventListener("click", () => showScreen("list")); detailScreen.querySelector('[data-action="edit"]').addEventListener("click", () => openForm(record.id)); detailScreen.querySelector('[data-action="delete"]').addEventListener("click", deleteRecord); }
    function openForm(id = "") { const record = records.find(item => item.id === id); previousScreen = id ? "detail" : "list"; formDishes = normalizeDishes(record?.mustEat || []); document.getElementById("formTitle").textContent = id ? "编辑收藏" : "添加收藏"; document.getElementById("recordId").value = record?.id || ""; document.getElementById("locationInput").value = record?.location || ""; document.getElementById("nameInput").value = record?.name || ""; document.getElementById("addressInput").value = record?.address || ""; document.getElementById("sourceInput").value = record?.source || ""; document.getElementById("categoryInput").value = record?.category || ""; document.getElementById("avgPriceInput").value = record?.avgPrice || ""; document.getElementById("noteInput").value = record?.note || ""; renderDishEditor(); updateFormMap(record?.location || ""); clearPoiResults(); showScreen("form"); setTimeout(() => document.getElementById("nameInput").focus(), 50); }
    function closeForm() { if (previousScreen === "detail" && selectedId) { renderDetail(); showScreen("detail"); } else { renderList(); showScreen("list"); } }
    function readForm() { const id = document.getElementById("recordId").value; const existing = records.find(item => item.id === id); const now = new Date().toISOString(); const mustEat = formDishes.map(item => ({ name: item.name.trim(), photo: item.photo || "" })).filter(item => item.name || item.photo); return { id: id || createId(), name: document.getElementById("nameInput").value.trim(), address: document.getElementById("addressInput").value.trim(), location: document.getElementById("locationInput").value.trim(), mustEat, source: document.getElementById("sourceInput").value.trim(), category: document.getElementById("categoryInput").value.trim(), avgPrice: Number(document.getElementById("avgPriceInput").value) || "", note: document.getElementById("noteInput").value.trim(), photo: existing?.photo || photos[records.length % photos.length], createdAt: existing?.createdAt || now, updatedAt: now }; }
    function deleteRecord() { const record = records.find(item => item.id === selectedId); if (!record || !confirm(`确定删除「${record.name}」吗？`)) return; records = records.filter(item => item.id !== selectedId); selectedId = records[0]?.id || ""; saveRecords(); renderList(); showScreen("list"); showToast("已删除"); }
    function showToast(message) { toast.textContent = message; toast.classList.add("show"); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600); }
    function jsonp(url, params) { return new Promise((resolve, reject) => { const callback = `amapPoi${Date.now()}${Math.random().toString(16).slice(2)}`; const script = document.createElement("script"); const query = new URLSearchParams({ ...params, callback }); const timer = setTimeout(() => { cleanup(); reject(new Error("请求超时")); }, 10000); function cleanup() { clearTimeout(timer); script.remove(); delete window[callback]; } window[callback] = data => { cleanup(); resolve(data); }; script.onerror = () => { cleanup(); reject(new Error("接口请求失败")); }; script.src = `${url}?${query.toString()}`; document.body.appendChild(script); }); }
    function cleanAmapValue(value) { if (Array.isArray(value)) return value.filter(Boolean).join(" "); if (!value || value === "[]" || value === "0") return ""; return String(value); }
    function getPoiAddress(poi) { return cleanAmapValue(poi.address) || [cleanAmapValue(poi.pname), cleanAmapValue(poi.cityname), cleanAmapValue(poi.adname)].filter(Boolean).join(""); }
    function getPoiCategory(poi) { return cleanAmapValue(poi.type).split(";").filter(Boolean).pop() || "餐饮"; }
    function getPoiCost(poi) { const cost = cleanAmapValue(poi.biz_ext?.cost || poi.biz_ext?.avg_cost); const number = Number(String(cost).replace(/[^\d.]/g, "")); return number > 0 ? Math.round(number) : ""; }
    function openPoiSheet() { poiSheet.classList.add("show"); }
    function closePoiSheet() { poiSheet.classList.remove("show"); }
    function clearPoiResults() { poiCandidates = []; poiResults.innerHTML = ""; closePoiSheet(); }
    function renderDishEditor() { dishEditor.innerHTML = formDishes.length ? formDishes.map((dish, index) => `<div class="dish-card" data-index="${index}"><div class="dish-photo">${dish.photo ? `<img src="${escapeHtml(dish.photo)}" alt="${escapeHtml(dish.name)}">` : escapeHtml((dish.name || "味").slice(0, 1))}</div><input class="dish-name-input" value="${escapeHtml(dish.name)}" placeholder="菜品名称"><div class="dish-actions"><button class="tiny-btn" type="button" data-action="upload">上传</button><button class="tiny-btn danger" type="button" data-action="delete">删除</button></div></div>`).join("") : `<div class="poi-empty">还没有必吃菜。搜店后可自动推荐，也可以手动添加。</div>`; dishEditor.querySelectorAll(".dish-card").forEach(card => { const index = Number(card.dataset.index); card.querySelector(".dish-name-input").addEventListener("input", event => { formDishes[index].name = event.target.value; }); card.querySelector('[data-action="upload"]').addEventListener("click", () => { editingDishIndex = index; dishPhotoInput.click(); }); card.querySelector('[data-action="delete"]').addEventListener("click", () => { formDishes.splice(index, 1); renderDishEditor(); }); }); }
    function addDish(name = "") { formDishes.push({ name, photo: "" }); renderDishEditor(); }
    function compressImage(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onerror = reject; reader.onload = () => { const image = new Image(); image.onerror = reject; image.onload = () => { const canvas = document.createElement("canvas"); const maxSide = 720; const scale = Math.min(1, maxSide / Math.max(image.width, image.height)); canvas.width = Math.max(1, Math.round(image.width * scale)); canvas.height = Math.max(1, Math.round(image.height * scale)); canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height); resolve(canvas.toDataURL("image/jpeg", .78)); }; image.src = reader.result; }; reader.readAsDataURL(file); }); }
    function getPoiDishes(poi) { return cleanAmapValue(poi.tag || poi.atag).split(/[,，;；、]/).map(item => item.trim()).filter(item => item && !/单人餐|双人餐|套餐|团购|外卖/.test(item)).slice(0, 5); }
    function renderPoiResults(items) { poiCandidates = items; openPoiSheet(); if (!items.length) { poiResults.innerHTML = `<div class="poi-empty">没有搜到匹配店铺，可以换一个更完整的店名。</div>`; return; } poiResults.innerHTML = `<div class="poi-guide">请选择下面一家店铺，点中后会自动填写地址、地图和推荐必吃</div>${items.map((poi, index) => { const dishes = getPoiDishes(poi).slice(0, 3).join("、"); return `<button class="poi-item" type="button" data-index="${index}"><strong>${escapeHtml(poi.name)}</strong><span>${escapeHtml(getPoiCategory(poi))} · ${escapeHtml(getPoiAddress(poi) || "暂无地址")}</span>${dishes ? `<span>推荐：${escapeHtml(dishes)}</span>` : ""}<em class="poi-select">选择这家</em></button>`; }).join("")}`; poiResults.querySelectorAll(".poi-item").forEach(button => { const select = event => { event.preventDefault(); applyPoi(Number(button.dataset.index)); }; button.addEventListener("pointerdown", select); button.addEventListener("click", select); }); }
    async function searchPoi() { const keyword = nameInput.value.trim(); if (!keyword) { showToast("先输入店名再搜索"); return; } poiSearchBtn.disabled = true; poiSearchBtn.textContent = "搜索"; try { const data = await jsonp("https://restapi.amap.com/v3/place/text", { key: AMAP_KEY, keywords: keyword, types: "050000", city: AMAP_CITY, citylimit: "false", offset: "10", page: "1", extensions: "all", output: "JSON" }); if (data.status !== "1") throw new Error(data.info || "高德接口返回异常"); renderPoiResults(Array.isArray(data.pois) ? data.pois : []); } catch (error) { clearPoiResults(); showToast(error.message || "搜索失败"); } finally { poiSearchBtn.disabled = false; poiSearchBtn.textContent = "搜店"; } }
    function applyPoi(index) { const poi = poiCandidates[index]; if (!poi) return; const address = getPoiAddress(poi); const category = getPoiCategory(poi); const avgPrice = getPoiCost(poi); const location = cleanAmapValue(poi.location); const rating = cleanAmapValue(poi.biz_ext?.rating); const tel = cleanAmapValue(poi.tel); const opentime = cleanAmapValue(poi.biz_ext?.opentime_today || poi.biz_ext?.opentime2 || poi.biz_ext?.open_time || poi.biz_ext?.opentime); const noteLines = [rating ? `高德评分：${rating}` : "", tel ? `电话：${tel}` : "", opentime ? `营业时间：${opentime}` : ""].filter(Boolean); document.getElementById("nameInput").value = cleanAmapValue(poi.name); document.getElementById("locationInput").value = location; if (address) document.getElementById("addressInput").value = address; if (category) document.getElementById("categoryInput").value = category; if (avgPrice) document.getElementById("avgPriceInput").value = avgPrice; if (!document.getElementById("sourceInput").value.trim()) document.getElementById("sourceInput").value = "高德地图"; const dishes = getPoiDishes(poi); if (!formDishes.some(item => item.name.trim()) && dishes.length) { formDishes = dishes.map(name => ({ name, photo: "" })); renderDishEditor(); } if (noteLines.length) { const noteInput = document.getElementById("noteInput"); const oldNote = noteInput.value.trim(); const mergedNote = noteLines.filter(line => !oldNote.includes(line)).join("\n"); noteInput.value = oldNote && mergedNote ? `${oldNote}\n${mergedNote}` : oldNote || mergedNote; } updateFormMap(location); closePoiSheet(); showToast(dishes.length ? "已填入店铺信息和推荐必吃" : "已填入店铺信息"); }
    async function geocodeAddress() { const address = addressInput.value.trim(); if (!address) { document.getElementById("locationInput").value = ""; updateFormMap(""); return; } try { const data = await jsonp("https://restapi.amap.com/v3/geocode/geo", { key: AMAP_KEY, address, city: AMAP_CITY, output: "JSON" }); const location = cleanAmapValue(data.geocodes?.[0]?.location); if (data.status === "1" && location) { document.getElementById("locationInput").value = location; updateFormMap(location); } } catch { /* Manual address can still be saved when geocoding fails. */ } }
    document.getElementById("addBtn").addEventListener("click", () => openForm());
    document.getElementById("filterBtn").addEventListener("click", () => categoryStrip.classList.toggle("show"));
    searchInput.addEventListener("input", renderList);
    poiSearchBtn.addEventListener("click", searchPoi);
    poiSheetClose.addEventListener("click", closePoiSheet);
    poiSheet.addEventListener("click", event => { if (event.target === poiSheet) closePoiSheet(); });
    addDishBtn.addEventListener("click", () => addDish());
    dishPhotoInput.addEventListener("change", async event => { const file = event.target.files?.[0]; if (!file || editingDishIndex < 0) return; try { formDishes[editingDishIndex].photo = await compressImage(file); renderDishEditor(); showToast("图片已上传"); } catch { showToast("图片处理失败"); } finally { event.target.value = ""; editingDishIndex = -1; } });
    nameInput.addEventListener("keydown", event => { if (event.key === "Enter") { event.preventDefault(); searchPoi(); } });
    addressInput.addEventListener("blur", geocodeAddress);
    document.querySelectorAll('[data-action="back"]').forEach(button => button.addEventListener("click", closeForm));
    form.addEventListener("submit", event => { event.preventDefault(); const nextRecord = readForm(); if (!nextRecord.name || !nextRecord.address) { showToast("请补全店名和地址"); return; } const index = records.findIndex(item => item.id === nextRecord.id); if (index >= 0) records[index] = nextRecord; else records.unshift(nextRecord); selectedId = nextRecord.id; saveRecords(); renderList(); renderDetail(); showScreen("detail"); showToast("已保存"); });
    renderList();
  </script>
